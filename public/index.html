<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2026 Hackathon - Student Registration</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script src="i18n.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .gradient-bg {
      background: radial-gradient(circle at top right, rgba(79, 70, 229, 0.25), transparent 40%),
                  radial-gradient(circle at bottom left, rgba(147, 51, 234, 0.2), transparent 40%),
                  #0f172a;
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .gradient-button {
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      transition: all 0.2s ease;
    }
    .gradient-button:hover {
      opacity: 0.95;
      transform: translateY(-1px);
      box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);
    }
    .ticket-dashed {
      border-top: 2px dashed rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body class="gradient-bg min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

  <!-- Main Container -->
  <main class="w-full max-w-lg mx-auto px-4 py-6 sm:py-10 flex-1 flex flex-col justify-center">

    <!-- Language Switcher (top-right floating) -->
    <div id="lang-switcher" class="flex justify-end mb-2"></div>

    <!-- Header / Banner -->
    <header class="text-center mb-6">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-500/10 border border-indigo-500/30 text-indigo-400 text-xs font-semibold tracking-wider uppercase mb-3">
        <i class="fa-solid fa-code"></i> <span data-i18n="header.badge">HACKATHON 2026</span>
      </div>
      <h1 class="text-2xl sm:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-white via-slate-100 to-indigo-200 tracking-tight" data-i18n="header.title">
        高校大学生黑客松活动
      </h1>
      <p class="text-sm text-slate-400 mt-1" data-i18n="header.subtitle">扫码一键注册 • 探索无限创意与极客精神</p>
    </header>

    <!-- Form Section -->
    <div id="form-container" class="glass-card rounded-2xl p-6 sm:p-8 shadow-2xl relative overflow-hidden transition-all duration-300">
      
      <div class="flex items-center justify-between border-b border-slate-700/60 pb-4 mb-6">
        <h2 class="text-lg font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-user-plus text-indigo-400"></i> <span data-i18n="form.title">选手信息注册</span>
        </h2>
        <span class="text-xs text-indigo-300 bg-indigo-950/60 px-2.5 py-1 rounded-md border border-indigo-800/40" data-i18n="form.required">
          * 必填项
        </span>
      </div>

      <!-- Alert Notice -->
      <div id="alert-box" class="hidden mb-4 p-3 rounded-xl text-sm font-medium flex items-center gap-2"></div>

      <form id="registration-form" class="space-y-4">
        
        <!-- Student Name -->
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">
            <span data-i18n="field.name">学生姓名</span> <span class="text-rose-400">*</span>
          </label>
          <div class="relative">
            <i class="fa-solid fa-user absolute left-3.5 top-3 text-slate-400 text-sm"></i>
            <input type="text" id="name" name="name" required data-i18n-placeholder="placeholder.name" placeholder="请输入您的真实姓名" 
              class="w-full bg-slate-900/80 border border-slate-700/80 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 text-slate-100 text-sm rounded-xl pl-10 pr-3 py-2.5 outline-none transition-all placeholder:text-slate-500">
          </div>
        </div>

        <!-- School Name -->
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">
            <span data-i18n="field.school">学校名称</span> <span class="text-rose-400">*</span>
          </label>
          <div class="relative">
            <i class="fa-solid fa-graduation-cap absolute left-3.5 top-3 text-slate-400 text-sm"></i>
            <input type="text" id="school" name="school" required data-i18n-placeholder="placeholder.school" placeholder="例如：清华大学 / 北京大学" 
              class="w-full bg-slate-900/80 border border-slate-700/80 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 text-slate-100 text-sm rounded-xl pl-10 pr-3 py-2.5 outline-none transition-all placeholder:text-slate-500">
          </div>
        </div>

        <!-- Department & Major (Grid) -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">
              <span data-i18n="field.department">院系名称</span> <span class="text-rose-400">*</span>
            </label>
            <div class="relative">
              <i class="fa-solid fa-building-columns absolute left-3.5 top-3 text-slate-400 text-sm"></i>
              <input type="text" id="department" name="department" required data-i18n-placeholder="placeholder.department" placeholder="例如：计算机学院" 
                class="w-full bg-slate-900/80 border border-slate-700/80 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 text-slate-100 text-sm rounded-xl pl-10 pr-3 py-2.5 outline-none transition-all placeholder:text-slate-500">
            </div>
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">
              <span data-i18n="field.major">专业名称</span> <span class="text-rose-400">*</span>
            </label>
            <div class="relative">
              <i class="fa-solid fa-book-bookmark absolute left-3.5 top-3 text-slate-400 text-sm"></i>
              <input type="text" id="major" name="major" required data-i18n-placeholder="placeholder.major" placeholder="例如：软件工程" 
                class="w-full bg-slate-900/80 border border-slate-700/80 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 text-slate-100 text-sm rounded-xl pl-10 pr-3 py-2.5 outline-none transition-all placeholder:text-slate-500">
            </div>
          </div>
        </div>

        <!-- Age & Phone (Grid) -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">
              <span data-i18n="field.age">年龄</span> <span class="text-rose-400">*</span>
            </label>
            <div class="relative">
              <i class="fa-solid fa-cake-candles absolute left-3.5 top-3 text-slate-400 text-sm"></i>
              <input type="number" id="age" name="age" min="15" max="60" required data-i18n-placeholder="placeholder.age" placeholder="例如：21" 
                class="w-full bg-slate-900/80 border border-slate-700/80 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 text-slate-100 text-sm rounded-xl pl-10 pr-3 py-2.5 outline-none transition-all placeholder:text-slate-500">
            </div>
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">
              <span data-i18n="field.phone">联系电话</span> <span class="text-rose-400">*</span>
            </label>
            <div class="relative">
              <i class="fa-solid fa-mobile-screen absolute left-3.5 top-3 text-slate-400 text-sm"></i>
              <input type="tel" id="phone" name="phone" required data-i18n-placeholder="placeholder.phone" placeholder="11位手机号码" 
                class="w-full bg-slate-900/80 border border-slate-700/80 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 text-slate-100 text-sm rounded-xl pl-10 pr-3 py-2.5 outline-none transition-all placeholder:text-slate-500">
            </div>
          </div>
        </div>

        <!-- Email -->
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">
            <span data-i18n="field.email">电子邮箱</span> <span class="text-rose-400">*</span>
          </label>
          <div class="relative">
            <i class="fa-solid fa-envelope absolute left-3.5 top-3 text-slate-400 text-sm"></i>
            <input type="email" id="email" name="email" required data-i18n-placeholder="placeholder.email" placeholder="your.name@example.com" 
              class="w-full bg-slate-900/80 border border-slate-700/80 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 text-slate-100 text-sm rounded-xl pl-10 pr-3 py-2.5 outline-none transition-all placeholder:text-slate-500">
          </div>
        </div>

        <!-- Attendance Mode Radio Selection -->
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-2">
            <span data-i18n="field.attendance">是否现场参加</span> <span class="text-rose-400">*</span>
          </label>
          <div class="grid grid-cols-2 gap-3">
            <label class="cursor-pointer">
              <input type="radio" name="attendance" value="in_person" checked class="peer sr-only">
              <div class="border border-slate-700/80 peer-checked:border-indigo-500 peer-checked:bg-indigo-600/20 peer-checked:text-indigo-300 text-slate-400 rounded-xl p-3 text-center transition-all flex flex-col items-center gap-1 hover:border-slate-600">
                <i class="fa-solid fa-people-roof text-lg"></i>
                <span class="text-xs font-medium" data-i18n="attendance.in_person">现场参加 (🏢 线下)</span>
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="attendance" value="online" class="peer sr-only">
              <div class="border border-slate-700/80 peer-checked:border-indigo-500 peer-checked:bg-indigo-600/20 peer-checked:text-indigo-300 text-slate-400 rounded-xl p-3 text-center transition-all flex flex-col items-center gap-1 hover:border-slate-600">
                <i class="fa-solid fa-laptop-code text-lg"></i>
                <span class="text-xs font-medium" data-i18n="attendance.online">线上参加 (🌐 远程)</span>
              </div>
            </label>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submit-btn" 
          class="w-full gradient-button text-white font-semibold py-3 px-4 rounded-xl text-sm flex items-center justify-center gap-2 mt-6">
          <span data-i18n="button.submit">立即提交报名</span>
          <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>

      </form>
    </div>

    <!-- Success Ticket Result Card (Hidden by Default) -->
    <div id="ticket-container" class="hidden glass-card rounded-2xl p-6 sm:p-8 shadow-2xl text-center transition-all duration-300">
      
      <div class="w-12 h-12 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-full flex items-center justify-center mx-auto mb-3">
        <i class="fa-solid fa-check text-xl"></i>
      </div>

      <h2 class="text-xl font-extrabold text-white" data-i18n="ticket.success">报名成功！</h2>
      <p class="text-xs text-slate-400 mt-1 mb-6" data-i18n="ticket.subtitle">这是您的 Hackathon 参赛通行证，请保存此凭证现场核销</p>

      <!-- Badge Pass Card -->
      <div class="bg-gradient-to-br from-slate-900 to-indigo-950/80 border border-indigo-500/30 rounded-xl p-5 text-left relative overflow-hidden shadow-inner mb-6">
        
        <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-3">
          <div class="flex items-center gap-2">
            <i class="fa-solid fa-id-card text-indigo-400"></i>
            <span class="text-xs font-bold uppercase tracking-wider text-indigo-300" data-i18n="ticket.pass">HACKATHON 2026 PASS</span>
          </div>
          <span id="ticket-attendance-badge" class="px-2 py-0.5 rounded text-[10px] font-bold"></span>
        </div>

        <div class="grid grid-cols-2 gap-y-2 text-xs mb-4">
          <div>
            <p class="text-slate-500 text-[10px]" data-i18n="ticket.name">选手姓名</p>
            <p id="ticket-name" class="font-bold text-white text-sm"></p>
          </div>
          <div>
            <p class="text-slate-500 text-[10px]" data-i18n="ticket.id">通行证编号</p>
            <p id="ticket-id" class="font-mono font-bold text-indigo-400 text-sm"></p>
          </div>
          <div>
            <p class="text-slate-500 text-[10px]" data-i18n="ticket.school">所属学校</p>
            <p id="ticket-school" class="font-medium text-slate-200 truncate"></p>
          </div>
          <div>
            <p class="text-slate-500 text-[10px]" data-i18n="ticket.major">院系专业</p>
            <p id="ticket-major" class="font-medium text-slate-200 truncate"></p>
          </div>
        </div>

        <!-- Ticket Dashed Separator -->
        <div class="ticket-dashed pt-4 flex flex-col items-center justify-center">
          <canvas id="qrcode-canvas" class="p-2 bg-white rounded-lg shadow-md mb-2"></canvas>
          <p class="text-[10px] text-slate-400" data-i18n="ticket.qrHint">出示此二维码或编号即可完成现场签到核销</p>
        </div>

      </div>

      <button id="reset-btn" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium py-2.5 px-4 rounded-xl text-xs transition-colors flex items-center justify-center gap-2">
        <i class="fa-solid fa-rotate-left"></i> <span data-i18n="ticket.reset">提交另一份报名</span>
      </button>

    </div>

    <!-- Admin Link footer -->
    <footer class="mt-8 text-center text-xs text-slate-500">
      <span data-i18n="footer.organizer">主办单位：大学生活动组织委员会</span> • 
      <a href="/admin" class="text-indigo-400 hover:underline inline-flex items-center gap-1 font-medium ml-1">
        <i class="fa-solid fa-user-shield"></i> <span data-i18n="footer.admin">管理后台</span>
      </a>
    </footer>

  </main>

  <script>
    // Render language switcher
    document.getElementById('lang-switcher').innerHTML = LangManager.renderSwitcher(false);
    LangManager.init();

    const form = document.getElementById('registration-form');
    const formContainer = document.getElementById('form-container');
    const ticketContainer = document.getElementById('ticket-container');
    const alertBox = document.getElementById('alert-box');
    const submitBtn = document.getElementById('submit-btn');
    const resetBtn = document.getElementById('reset-btn');

    function showAlert(msg, isError = true) {
      alertBox.className = `mb-4 p-3 rounded-xl text-xs font-medium flex items-center gap-2 ${
        isError 
          ? 'bg-rose-500/15 border border-rose-500/30 text-rose-300' 
          : 'bg-emerald-500/15 border border-emerald-500/30 text-emerald-300'
      }`;
      alertBox.innerHTML = `<i class="fa-solid ${isError ? 'fa-circle-exclamation' : 'fa-circle-check'}"></i> <span>${msg}</span>`;
      alertBox.classList.remove('hidden');
    }

    function hideAlert() {
      alertBox.classList.add('hidden');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();

      const formData = new FormData(form);
      const data = Object.fromEntries(formData.entries());

      // Validation
      if (!data.phone || !/^1[3-9]\d{9}$/.test(data.phone.trim())) {
        showAlert(LangManager.t('alert.phone'));
        return;
      }

      if (!data.email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email.trim())) {
        showAlert(LangManager.t('alert.email'));
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span>${LangManager.t('button.submitting')}</span>`;

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        const result = await res.json();

        if (result.success) {
          showTicket(result.data);
        } else {
          showAlert(result.message || LangManager.t('alert.network'));
        }
      } catch (err) {
        showAlert(LangManager.t('alert.network'));
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>${LangManager.t('button.submit')}</span> <i class="fa-solid fa-arrow-right text-xs"></i>`;
      }
    });

    function showTicket(record) {
      formContainer.classList.add('hidden');
      ticketContainer.classList.remove('hidden');

      document.getElementById('ticket-name').textContent = record.name;
      document.getElementById('ticket-id').textContent = record.id;
      document.getElementById('ticket-school').textContent = record.school;
      document.getElementById('ticket-major').textContent = `${record.department} - ${record.major}`;

      const badge = document.getElementById('ticket-attendance-badge');
      if (record.attendance === 'in_person') {
        badge.className = 'px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30';
        badge.textContent = LangManager.t('badge.in_person');
      } else {
        badge.className = 'px-2 py-0.5 rounded text-[10px] font-bold bg-sky-500/20 text-sky-300 border border-sky-500/30';
        badge.textContent = LangManager.t('badge.online');
      }

      // Generate QR Code with ID or URL
      const canvas = document.getElementById('qrcode-canvas');
      QRCode.toCanvas(canvas, record.id, {
        width: 140,
        margin: 1,
        color: { dark: '#0f172a', light: '#ffffff' }
      });
    }

    resetBtn.addEventListener('click', () => {
      form.reset();
      hideAlert();
      ticketContainer.classList.add('hidden');
      formContainer.classList.remove('hidden');
    });
  </script>
</body>
</html>
